model_name: 'catboost'

model_output_paths:
  dir: 'models'
  model: 'models/catboost.joblib'
  scaler: 'models/catboost_scaler.joblib'

preprocessing:
  test_size: 0.2
  eval_size: 0.15
  amount_col: 'Amount'

model_params:
  iterations: 2000
  depth: 16
  learning_rate: 0.01
  subsample: 0.5

early_stopping:
  enabled: True
  stopping_rounds: 50
